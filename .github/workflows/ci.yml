name: CI

# Every pull request and every push to main: manifest.json is the files', every JSON file matches
# its schema, the links resolve, the format is Prettier's, and part of the vectors is computed
# again with an independent implementation (README.md, "Where the vectors come from").
# GitHub-hosted runners only: on a public repository, a pull request from a fork must never run on
# a self-hosted runner (GitHub's advice).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Manifest, schemas, links, format, vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache (`cache: npm`): five dev dependencies, which `npm ci` installs in seconds.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm ls --all
      - run: npm run manifest:check
      - run: npm run schemas
      - run: npm run links
      - run: npm run format:check
      - run: npm run recompute
